services:
  relay:
    image: ${OUTPOST_PI_E2E_RELAY_IMAGE:-outpost-pi-relay:0.1.0}
    build:
      context: ../relay
      dockerfile: Dockerfile
    environment:
      OUTPOSTPI_RELAY_PORT: "3000"
      OUTPOSTPI_MESH_DB_PATH: /data/mesh.db
      RUST_LOG: info
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "127.0.0.1::8474"
      - "127.0.0.1::8666"
      - "127.0.0.1::8667"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 1s
      timeout: 2s
      retries: 30

  pi-host:
    build:
      context: ..
      dockerfile: e2e/services/pi-host.Dockerfile
    init: true
    # NO restart policy: the image's CMD respawns the node process in a shell
    # loop (see pi-host.Dockerfile). docker restart-policy backoff on fast
    # sub-10s generations was Mode B of the e2e flake — see that comment.
    depends_on:
      relay:
        condition: service_healthy
    environment:
      HOME: /tmp/outpost-pi-e2e-home
      OUTPOST_PI_RELAY: http://relay:3000
      OUTPOST_PI_ALLOW_FILE_IDENTITY: "1"
      OUTPOST_PI_PAIR_CODE_FILE: /tmp/outpost-pi-e2e-pair-code.json
      E2E_PI_HOST_PORT: "4317"
      E2E_PI_CWD: /tmp/outpost-pi-e2e-cwd
      E2E_SEEDED_TRANSCRIPT: e2e persisted transcript
    volumes:
      - ../:/workspace:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4317/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 1s
      timeout: 2s
      retries: 45
      start_period: 2s

volumes:
  relay-data:

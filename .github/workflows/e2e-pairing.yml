name: pairing-e2e

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pairing-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  pairing:
    name: Pairing and protected owner channel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pi-extension/pnpm-lock.yaml

      - name: Install Pi-extension dependencies
        working-directory: pi-extension
        run: pnpm install --frozen-lockfile

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run source-built relay pairing suite
        env:
          FLUTTER: flutter
        run: bash e2e/run-pairing.sh

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter change detection on PRs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_FLUTTER_VERSION: "3.47.1"
  COCKPIT_FLUTTER_VERSION: "3.44.4" # frozen: cockpit dormancy guard
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  public-exposure:
    name: public exposure (fixtures + tracked tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test exposure scanner
        run: scripts/check-public-exposure.test.sh
      - name: Scan tracked tree
        run: scripts/check-public-exposure.sh --tree
      - name: Scan branch history
        run: scripts/check-public-exposure.sh --history HEAD

  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      brand-contract: ${{ steps.filter.outputs.brand-contract }}
      pi-extension: ${{ steps.filter.outputs.pi-extension }}
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      cockpit: ${{ steps.filter.outputs.cockpit }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          # The workflow file itself triggers every lane: a pipeline change is
          # verified by the pipeline.
          filters: |
            protocol:
              - 'protocol/**'
              - 'tools/protocol-codegen/**'
              - '.github/workflows/ci.yml'
            brand-contract:
              - '.mockups/design-system/tokens.css'
              - 'branding/logo-foreground.svg'
              - 'branding/logo-full-dark.svg'
              - 'branding/logo-full-light.svg'
              - 'branding/logo-monochrome.svg'
              - 'branding/banner.svg'
              - 'branding/theme-contract.json'
              - 'scripts/test_brand_contract.py'
              - 'scripts/brand_contract.py'
              - 'scripts/generate-brand-assets.py'
              - 'scripts/sync-brand-contracts.py'
              - 'site/src/generated/constellation_mark.generated.ts'
              - '.github/workflows/ci.yml'
            pi-extension:
              - 'pi-extension/**'
              - 'protocol/**'
              - 'tools/protocol-codegen/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'relay/**'
              - 'rp-s3/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'protocol/**'
              - '.mockups/design-system/tokens.css'
              - 'branding/theme-contract.json'
              - 'scripts/run_app_perf_regressions.sh'
              - '.github/workflows/ci.yml'
            cockpit:
              - 'cockpit/**'
              # dormant-guard: contract drift from the extension side must
              # still wake the cockpit compile+test check (freeze-with-guard
              # posture — see AGENTS.md § Cockpit dormancy).
              - 'protocol/**'
              - 'pi-extension/src/extension/**'
              - '.mockups/design-system/tokens.css'
              - 'branding/theme-contract.json'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - 'branding/logo-foreground.svg'
              - 'branding/logo-full-dark.svg'
              - 'branding/logo-full-light.svg'
              - 'branding/logo-monochrome.svg'
              - 'branding/banner.svg'
              - 'scripts/brand_contract.py'
              - 'scripts/generate-brand-assets.py'
              - 'scripts/sync-brand-contracts.py'
              - '.github/workflows/ci.yml'

  brand-contract:
    name: brand contract (fixture + geometry freshness)
    needs: changes
    if: needs.changes.outputs.brand-contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated brand contracts
        run: python3 scripts/sync-brand-contracts.py --check
      - name: Run brand-contract parser regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  protocol:
    name: protocol (fixtures + codegen checks)
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: protocol/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: protocol
        run: pnpm install --frozen-lockfile
      - name: Check fixtures + codegen
        working-directory: protocol
        run: pnpm check

  pi-extension:
    name: pi-extension (typecheck + test)
    needs: changes
    if: needs.changes.outputs.pi-extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pi-extension/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: pi-extension
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: pi-extension
        run: pnpm typecheck
      - name: Test
        working-directory: pi-extension
        run: pnpm test

  rust:
    name: ${{ matrix.crate }} (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [relay, rp-s3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Format check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check
      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy -- -D warnings
      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test

  app:
    name: app (analyze + test)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test --exclude-tags e2e
      - name: Performance regression budgets
        run: scripts/run_app_perf_regressions.sh
      - name: Identity package tests
        working-directory: app/packages/outpost_pi_identity
        run: |
          flutter pub get
          flutter test

  app-e2e:
    name: app e2e (android emulator)
    needs: [changes, app]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # AGENTS.md memory discipline: cap the Gradle heap on shared runners too.
      ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Warm pub cache
        working-directory: app
        run: flutter pub get
      - name: KVM gate (fail loud — no software-emulation fallback)
        run: |
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm missing or not writable — refusing to run the emulator under software emulation"
            exit 1
          fi
          ls -l /dev/kvm
      - name: Install emulator + system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null
      - name: Create AVD
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n outpost34 -k "system-images;android-34;google_apis;x86_64" -d pixel_6
      - name: Boot emulator (one retry, then fail red)
        run: |
          boot() {
            "$ANDROID_HOME/emulator/emulator" -avd outpost34 -no-window \
              -gpu swiftshader_indirect -noaudio -no-boot-anim \
              -camera-back virtualscene -no-snapshot -memory 3072 &
            local emu_pid=$!
            for _ in $(seq 1 60); do
              b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              [ "$b" = "1" ] && return 0
              kill -0 "$emu_pid" 2>/dev/null || return 1
              sleep 5
            done
            return 1
          }
          boot || { echo "::warning::first boot attempt failed — retrying once"; pkill -f qemu-system || true; sleep 5; boot; }
      - name: Scanner boundary smoke (grant-loop harness)
        run: scripts/emulator-scanner-smoke.sh emulator-5554
      - name: Kill emulator
        if: always()
        run: adb emu kill || pkill -f qemu-system || true

  cockpit:
    name: cockpit (analyze + test)
    needs: changes
    if: needs.changes.outputs.cockpit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.COCKPIT_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: cockpit
        run: flutter pub get
      - name: Analyze
        working-directory: cockpit
        run: flutter analyze
      - name: Test
        working-directory: cockpit
        run: flutter test

  site:
    name: site (lint + build + browser test)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium
      - name: Check
        working-directory: site
        run: pnpm check

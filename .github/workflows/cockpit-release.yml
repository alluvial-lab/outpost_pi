# Cockpit release (plan 43, step 3).
#
# Trigger: tag `cockpit-v<version>` (the version MUST match pubspec.yaml).
# Produces: a GitHub Release with 6 artifacts + SHA256SUMS + latest.json.
# Manifests and appcasts are not currently published/deployed; the site and
# self-update remain disabled until distribution is configured.
#
# Platform runbook: cockpit/packaging/README.md.

name: cockpit-release

on:
  push:
    tags: ["cockpit-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cockpit-v1.0.0); must exist"
        required: true

permissions:
  contents: write

concurrency:
  group: cockpit-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.41.7"

jobs:
  meta:
    name: Validate tag ↔ pubspec
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: v
        run: |
          VERSION="${RELEASE_TAG#cockpit-v}"
          FULL=$(grep '^version:' cockpit/pubspec.yaml | awk '{print $2}')
          PUBSPEC="${FULL%%+*}"
          BUILD="${FULL##*+}"
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::tag $RELEASE_TAG requires $VERSION but pubspec is $PUBSPEC"
            exit 1
          fi
          # Plan 47: Sparkle (macOS) compares CFBundleVersion (the +n). Without a
          # build number self-update cannot detect the new version — require an explicit +n.
          if [ "$BUILD" = "$FULL" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec needs a build number (e.g. $VERSION+8) for Sparkle to compare the version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS dmg (universal, notarized)
    needs: meta
    runs-on: macos-latest
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Require Apple signing configuration
        run: |
          if [ -z "$SIGN_ID" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY secret is required for release signing"
            exit 1
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID secret is required for release signing"
            exit 1
          fi

      - name: Import Developer ID certificate into temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -Fq "$SIGN_ID"; then
            rm "$RUNNER_TEMP/cert.p12"
            echo "::error::Imported certificate does not contain APPLE_SIGNING_IDENTITY ('$SIGN_ID')"
            exit 1
          fi
          # Verify the imported Developer ID certificate belongs to the
          # configured Apple team. The Organizational Unit (OU) of a Developer
          # ID Application certificate is the 10-character team ID, so a
          # mismatch means the identity is from a different team and must not
          # be used to publish Outpost-Pi.
          CERT_CN=$(security find-certificate -c "$SIGN_ID" -p "$KEYCHAIN" \
            | openssl x509 -noout -subject -nameopt multiline 2>/dev/null)
          CERT_OU=$(printf '%s\n' "$CERT_CN" \
            | awk -F' *= *' '/organizationalUnitName/ {gsub(/[[:space:]]+$/,"",$2); print $2}')
          if [ -z "$CERT_OU" ]; then
            rm "$RUNNER_TEMP/cert.p12"
            echo "::error::Could not extract the team ID (OU) from '$SIGN_ID'; the certificate is not a valid Developer ID Application identity"
            exit 1
          fi
          if [ "$CERT_OU" != "$APPLE_TEAM_ID" ]; then
            rm "$RUNNER_TEMP/cert.p12"
            echo "::error::APPLE_SIGNING_IDENTITY team '$CERT_OU' does not match APPLE_TEAM_ID '$APPLE_TEAM_ID'; refusing to sign with a foreign team identity"
            exit 1
          fi
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build · sign · notarize · zip (Sparkle) · dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          flutter pub get
          flutter build macos --release
          APP="build/macos/Build/Products/Release/Cockpit.app"
          # Sign the .app (Developer ID + Hardened Runtime + timestamp). --deep
          # covers nested Sparkle components (Sparkle.framework,
          # Autoupdate, Updater.app, XPCServices), required for notarization.
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist
          echo "$APPLE_API_KEY" | base64 -d > "$RUNNER_TEMP/apikey.p8"
          notarize() {
            xcrun notarytool submit "$1" --key "$RUNNER_TEMP/apikey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          }
          # 1) Notarize the .app (by submitting a zip) and staple the ticket to the bundle.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple "$APP"
          # 2) Sparkle update artifact (plan 47): zip of the already
          #    notarized-and-stapled .app — Sparkle replaces the bundle in place (zip is
          #    the recommended path, not the dmg). It does NOT go into latest.json.
          ditto -c -k --keepParent "$APP" "dist/Cockpit-${VERSION}-macos.zip"
          # 3) First-install DMG, from the already stapled .app.
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dist/OutpostPiCockpit-${VERSION}-macos-universal.dmg"
          hdiutil create -volname "Outpost-Pi Cockpit" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          codesign --force --timestamp --sign "$SIGN_ID" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          rm "$RUNNER_TEMP/apikey.p8"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          # dmg (first installation) + Cockpit-<v>-macos.zip (Sparkle update).
          path: cockpit/dist/*
          if-no-files-found: error

  windows:
    name: Windows exe (x64, Inno Setup)
    needs: meta
    runs-on: windows-latest
    defaults: { run: { working-directory: cockpit, shell: bash } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Build + package
        run: |
          flutter pub get
          flutter build windows --release
          dart pub global run fastforge:main package --platform windows --targets exe
          EXE=$(find dist -name "*.exe" | head -1)
          test -n "$EXE"
          mkdir -p out
          mv "$EXE" "out/OutpostPiCockpit-Setup-${VERSION}-windows-x64.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe
          path: cockpit/out/*.exe
          if-no-files-found: error

  linux:
    name: Linux deb+rpm (${{ matrix.deb_arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Flutter x64 (SDK empacotado)
        if: matrix.deb_arch == 'amd64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # No packaged Flutter SDK exists for linux-arm64 (flutter-action
      # fails on an ARM host). The supported path is to run from git: the
      # tool bootstraps itself and downloads the arm64 engine artifacts.
      - name: Flutter arm64 (via git)
        if: matrix.deb_arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: System dependencies (GTK, ninja, rpmbuild, libmpv)
        run: |
          sudo apt-get update
          # libmpv-dev: media_kit links against libmpv on Linux (plan 46).
          # Runtime declared by the packages: deb libmpv2 / rpm mpv-libs.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm libmpv-dev
          flutter --version
          dart pub global activate fastforge

      - name: Build + package
        run: |
          flutter pub get
          flutter build linux --release
          dart pub global run fastforge:main package --platform linux --targets deb
          dart pub global run fastforge:main package --platform linux --targets rpm
          DEB=$(find dist -name "*.deb" | head -1); test -n "$DEB"
          RPM=$(find dist -name "*.rpm" | head -1); test -n "$RPM"
          mkdir -p out
          mv "$DEB" "out/outpost-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          mv "$RPM" "out/outpost-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm"

      - name: Smoke test .deb (install on the runner itself)
        run: |
          sudo apt-get install -y "./out/outpost-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg -L outpost-pi-cockpit | grep -m1 "\.desktop$"

      - name: Smoke test .rpm (container fedora:40)
        run: |
          # rpm -qpl queries the FILE (the package's internal name is not
          # outpost-pi-cockpit — Fastforge's maker uses the pubspec name).
          docker run --rm -v "$PWD/out:/out:ro" fedora:40 bash -c \
            "dnf install -y /out/outpost-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm \
             && rpm -qpl /out/outpost-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm | grep -m1 '\.desktop$'"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.deb_arch }}
          path: cockpit/out/*
          if-no-files-found: error

  publish:
    name: GitHub Release + latest.json
    needs: [meta, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS and latest.json
        run: |
          cd release
          sha256sum * > SHA256SUMS
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          : > artifacts.ndjson
          for f in *; do
            case "$f" in
              *macos-universal.dmg) p=macos   a=universal fmt=dmg ;;
              *windows-x64.exe)     p=windows a=x64       fmt=exe ;;
              *_amd64.deb)          p=linux   a=x64       fmt=deb ;;
              *_arm64.deb)          p=linux   a=arm64     fmt=deb ;;
              *.x86_64.rpm)         p=linux   a=x64       fmt=rpm ;;
              *.aarch64.rpm)        p=linux   a=arm64     fmt=rpm ;;
              *) continue ;;
            esac
            jq -n --arg platform "$p" --arg arch "$a" --arg format "$fmt" \
              --arg url "$BASE/$f" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$f")" \
              '{platform:$platform, arch:$arch, format:$format, url:$url, sha256:$sha256, size:$size}' \
              >> artifacts.ndjson
          done
          COUNT=$(jq -s length artifacts.ndjson)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::expected 6 artifacts in the manifest, found $COUNT"
            exit 1
          fi
          # Notes: first CHANGELOG section; generic fallback.
          NOTES=$(awk '/^## /{n++} n==1' ../cockpit/CHANGELOG.md | tail -n +2 | sed '/^$/d' | head -20)
          [ -n "$NOTES" ] || NOTES="Outpost-Pi Cockpit ${VERSION}"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%F)" \
            --arg notes "$NOTES" --slurpfile artifacts artifacts.ndjson \
            '{version:$version, date:$date, notes:$notes, artifacts:$artifacts}' \
            > latest.json
          rm artifacts.ndjson
          cat latest.json

      - name: Sign macOS artifact and generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          # Plan 47 — ed25519 is deterministic, so PyNaCl generates the
          # signature Sparkle verifies. No native tool is needed on the runner.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          cat > "$RUNNER_TEMP/sign.py" <<'PY'
          import base64, os, sys
          from nacl.signing import SigningKey
          seed = base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY'].strip())
          data = open(sys.argv[1], 'rb').read()
          print(base64.b64encode(SigningKey(seed).sign(data).signature).decode())
          PY
          sign() { "$RUNNER_TEMP/venv/bin/python3" "$RUNNER_TEMP/sign.py" "$1"; }
          cd release
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          ZIP="Cockpit-${VERSION}-macos.zip"
          test -f "$ZIP"
          MAC_SIG=$(sign "$ZIP"); MAC_LEN=$(stat -c%s "$ZIP")
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          NOTES=$(jq -r .notes latest.json)
          # macOS: sparkle:version = CFBundleVersion (build +n); shortVersion = marketing.
          cat > appcast-macos.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Outpost-Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>10.15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[${NOTES}]]></description>
                <enclosure url="${BASE}/${ZIP}" sparkle:edSignature="${MAC_SIG}" length="${MAC_LEN}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          echo "== appcast-macos.xml =="; cat appcast-macos.xml

      # Intentionally skipped until the locked auto_updater_windows 1.0.0
      # integration has a tested version contract. Its SetFeedURL calls only
      # win_sparkle_set_appcast_url() and win_sparkle_init(); without
      # win_sparkle_set_app_build_version(), WinSparkle compares the appcast
      # against Runner.rc's VERSIONINFO string (x.y.z+n), not a bare +n. Re-enable
      # only with a Windows smoke proving higher +n accepted and equal/lower
      # rejected. No Windows appcast or signature is produced or uploaded while
      # disabled. The inherited 1.5.1 -> 0.x reset still requires one manual install.
      - name: Windows appcast disabled (unproven WinSparkle version contract)
        if: ${{ false }}
        run: echo "Windows appcast generation remains intentionally disabled"

      - name: Create (or update) GitHub Release
        run: |
          NOTES_FILE=$(mktemp)
          jq -r .notes release/latest.json > "$NOTES_FILE"
          {
            echo ""
            echo "---"
            echo "**Publishing:** manifests and appcasts are not currently"
            echo "published/deployed. The card/site and self-update remain"
            echo "disabled until distribution is configured."
          } >> "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --title "Outpost-Pi Cockpit ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest=false
          fi

      - name: Summary
        run: |
          {
            echo "## Cockpit ${VERSION} published"
            echo ""
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo ""
            echo "**Publishing:** manifests and appcasts are not currently"
            echo "published/deployed; the site/card and self-update remain"
            echo "disabled until distribution is configured."
          } >> "$GITHUB_STEP_SUMMARY"

# Android release for the Outpost-Pi app (app/).
#
# Trigger: tag `app-v<version>` (the version MUST match app/pubspec.yaml).
# Produces: a GitHub Release with a signed `OutpostPi.apk` (release keystore) +
# SHA256SUMS. No stores — direct APK distribution.
#
# Signing safeguards: Gradle allows no-key configuration/debug work but rejects
# release APK/AAB task graphs unless their release signing material is complete.
# The job also compares certificate fingerprints as defense in depth.

name: app-release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. app-v1.1.0); must exist"
        required: true

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.41.7"

jobs:
  android:
    name: Signed APK
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag ↔ pubspec
        id: v
        run: |
          VERSION="${RELEASE_TAG#app-v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::tag $RELEASE_TAG requires $VERSION but the app pubspec is $PUBSPEC"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify no-key release signing guard
        run: |
          flutter pub get
          android/check_release_signing_guard.sh

      - name: Restore keystore and key.properties
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/signing
          echo "$ANDROID_KEYSTORE" | base64 -d > android/signing/outpostpi-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=signing/outpostpi-release.jks
          EOF

      - name: Build APK release
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify release signer (defense in depth)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK_CERT=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          KS_CERT=$(keytool -list -v -keystore android/signing/outpostpi-release.jks \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | grep -m1 "SHA256:" | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "apk:      $APK_CERT"
          echo "keystore: $KS_CERT"
          if [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$KS_CERT" ]; then
            echo "::error::APK signer does not match the configured release keystore"
            exit 1
          fi

      - name: Generate latest.json (app manifest)
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/OutpostPi.apk
          (cd out && sha256sum OutpostPi.apk > SHA256SUMS)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%F)" \
            --arg notes "Outpost-Pi (app) ${VERSION}" \
            --arg url "$BASE/OutpostPi.apk" \
            --arg sha256 "$(sha256sum out/OutpostPi.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s out/OutpostPi.apk)" \
            '{version:$version, date:$date, notes:$notes, artifacts:[
               {platform:"android", arch:"universal", format:"apk",
                url:$url, sha256:$sha256, size:$size}]}' \
            > out/latest.json
          cat out/latest.json

      - name: Create (or update) GitHub Release
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/OutpostPi.apk out/SHA256SUMS out/latest.json --clobber
          else
            NOTES_FILE=$(mktemp)
            {
              echo "Signed Android APK — direct installation. Verify integrity with SHA256SUMS."
              echo ""
              echo "---"
              echo "**Site publishing:** the site and in-app notice remain without live updates until the operator configures a manifest endpoint."
            } > "$NOTES_FILE"
            gh release create "$RELEASE_TAG" out/OutpostPi.apk out/SHA256SUMS out/latest.json \
              --title "Outpost-Pi (app) ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest=false
          fi

      - name: Summary
        run: |
          {
            echo "## Outpost-Pi app ${{ steps.v.outputs.version }} — APK published"
            echo ""
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo ""
            echo "Asset: \`OutpostPi.apk\` (signed with the release keystore, verified by the job)."
            echo ""
            echo "**Site/in-app updates:** remain disabled until the operator"
            echo "explicitly configures a manifest endpoint for this release."
          } >> "$GITHUB_STEP_SUMMARY"

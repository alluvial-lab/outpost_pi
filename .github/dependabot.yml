# Rebase strategy is "disabled" in every entry to avoid automatic branch churn.
# Refresh stale or conflicted PRs with an `@dependabot recreate` comment; this
# rebuilds the branch from the current main and runs CI on the fresh head.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /pi-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # 0.81.x–0.84.x remove AuthStorage and ModelRegistry.create; defer these
    # lines until the Pi SDK integration is migrated.
    ignore:
      - dependency-name: "@earendil-works/pi-coding-agent"
        versions: [">= 0.81.0, < 0.85.0"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # TS majors deferred by choice (site stays on 5.9.x); remove to re-enable
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /protocol
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # TS majors deferred by choice (protocol stays on 6.0.x); remove to re-enable
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /relay
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # rand 0.9 requires replacing deprecated thread_rng call sites.
    ignore:
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ed25519-dalek"
        versions: [">= 3.0.0, < 4.0.0"]
      - dependency-name: "axum"
        versions: [">= 0.8.0, < 0.9.0"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /rp-s3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # Deferred majors require explicit source migrations; remove to re-enable.
    ignore:
      - dependency-name: "app_settings"
        update-types: ["version-update:semver-major"]
      - dependency-name: "share_plus"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flutter_secure_storage"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /cockpit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # flutter_local_notifications majors deferred (18->22 needs v22 API migration
    # in local_notifier.dart + system_permissions_impl.dart); remove to re-enable
    ignore:
      - dependency-name: "flutter_local_notifications"
        update-types: ["version-update:semver-major"]
      # 0.0.53 removes dialog/popover APIs used throughout Cockpit. Allow a
      # later pre-1.0 release to be tested instead of reopening this exact bump.
      - dependency-name: "shadcn_flutter"
        versions: ["0.0.53"]
      # The dependency already resolves to 4.0.0 through an intentional git
      # override; ignore the no-op published-version suggestion only.
      - dependency-name: "xterm"
        versions: ["4.0.0"]
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /app/packages/outpost_pi_identity
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

# Rebase strategy is "disabled" in every entry to cap CI-minutes churn
# (private-repo Actions budget; see .work/active/stories/story-dependabot-drain-resume.md).
# Conflicted PRs: rebase manually (git rebase main + force-push to the
# dependabot branch) or close and let dependabot recreate at the newer version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /pi-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # TS majors deferred by choice (site stays on 5.9.x); remove to re-enable
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /protocol
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # TS majors deferred by choice (protocol stays on 6.0.x); remove to re-enable
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /relay
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /rp-s3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    # app_settings majors deferred (5.x -> 8.x needs migration); remove to re-enable
    ignore:
      - dependency-name: "app_settings"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /cockpit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # flutter_local_notifications majors deferred (18->22 needs v22 API migration
    # in local_notifier.dart + system_permissions_impl.dart); remove to re-enable
    ignore:
      - dependency-name: "flutter_local_notifications"
        update-types: ["version-update:semver-major"]
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /app/packages/outpost_pi_identity
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: deps
      include: scope

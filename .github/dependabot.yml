version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /pi-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TS majors deferred by choice (site stays on 5.9.x); remove to re-enable
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /protocol
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TS majors deferred by choice (protocol stays on 6.0.x); remove to re-enable
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /relay
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /rp-s3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # app_settings majors deferred (5.x -> 8.x needs migration); remove to re-enable
    ignore:
      - dependency-name: "app_settings"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /cockpit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pub
    directory: /app/packages/outpost_pi_identity
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

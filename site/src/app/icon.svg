<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid black background -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Pi symbol (geometric; font-independent) -->
  <!-- Centered in the canvas, inside Android's safe zone (~66% of the canvas) -->
  <g fill="#FFFFFF">
    <!-- Upper horizontal bar -->
    <rect x="290" y="368" width="444" height="68" rx="10"/>
    <!-- Left leg -->
    <rect x="345" y="436" width="68" height="320" rx="10"/>
    <!-- Right leg -->
    <rect x="611" y="436" width="68" height="320" rx="10"/>
    <!-- Subtle curve at the right foot (extension to the right) -->
    <path d="M 679 720 Q 712 740 720 700 L 720 712 Q 720 756 668 756 L 668 736 Z" fill="#FFFFFF"/>
  </g>

  <!-- Distinctive blue dot, positioned in the upper-right corner -->
  <circle cx="780" cy="332" r="58" fill="#4FC3F7"/>
</svg>

# Fastforge (plus_flutter_distributor) — orchestrates build + packaging.
# Run with:  fastforge release --name <channel>
#
# Each format's make_config.yaml lives in <platform>/packaging/<format>/
# (a fixed Fastforge convention), not in packaging/<platform>/. See packaging/README.md.
output: dist/
variables:
  # Override with env in CI; here they are kept as reference/local.
  APPLE_SIGNING_IDENTITY: "Developer ID Application: Jacob Moura (U843T2P7A2)"

releases:
  # macOS: universal DMG (signing + notarization are separate manual/CI steps;
  # see packaging/README.md — Fastforge generates the DMG, sign/notarize runs after).
  - name: macos
    jobs:
      - name: dmg
        package:
          platform: macos
          target: dmg

  # Windows: Inno Setup installer (.exe). NOT buildable on this Mac — CI only.
  - name: windows
    jobs:
      - name: exe
        package:
          platform: windows
          target: exe

  # Linux: .deb and .rpm. NOT buildable on this Mac — CI only (ubuntu-24.04 + rpmbuild).
  - name: linux
    jobs:
      - name: deb
        package:
          platform: linux
          target: deb
      - name: rpm
        package:
          platform: linux
          target: rpm

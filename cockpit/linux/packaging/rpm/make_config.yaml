# Pacote .rpm do Cockpit. NÃO buildável neste Mac — gerado no CI (ubuntu-24.04
# com `apt install rpm` → rpmbuild; arch detectada por uname -m). Valida-se em
# container fedora:40 (premissa do plano).
#
# Artefato resultante: outpost-pi-cockpit-<versão>.<arch>.rpm
display_name: Outpost-Pi Cockpit
summary: Cliente desktop multi-pane do Outpost-Pi
license: LicenseRef-proprietary
url: https://kevoun.com
vendor: Kevoun
packager: Kevoun
packagerEmail: <operator contact email>
group: Development/Tools
generic_name: Outpost-Pi Cockpit
# Deps de runtime: GTK3 (nome do pacote no Fedora).
requires:
  - gtk3
  # Plano 46 — preview de A/V via media_kit (libmpv) usando a lib do sistema.
  - mpv-libs
categories:
  - Development
  - IDE
keywords:
  - pi
  - outpost-pi
  - agent
  - cockpit
startup_notify: true
icon: linux/runner/resources/app_icon_512.png
metainfo: linux/work.jacobmoura.cockpit.metainfo.xml
description: |
  Cockpit é o cliente desktop do Outpost-Pi: uma GUI multi-pane sobre o motor do
  Pi. Roda agentes (cada um um `pi --mode rpc`) e terminais lado a lado, com
  árvore de arquivos, worktrees por workspace e agendamento de daemons.

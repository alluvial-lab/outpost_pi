# Cockpit .deb package. NOT buildable on this Mac — generated in the `linux-x64`
# (ubuntu-24.04) and `linux-arm64` (ubuntu-24.04-arm) CI jobs. The architecture
# is detected by Fastforge (uname -m) on the runner.
#
# Resulting artifact: outpost-pi-cockpit_<version>_<arch>.deb
display_name: Outpost-Pi Cockpit
package_name: outpost-pi-cockpit
# Installed-Size of the .deb package, in KB (mandatory field for the Fastforge maker).
# Estimate of the Flutter Linux release bundle (~150 MB); recalibrate with
# `du -sk build/linux/*/release/bundle` once there is a real Linux build.
installed_size: 150000
maintainer:
  name: Kevoun
  email: <operator contact email>
section: devel
priority: optional
# Runtime deps: GTK3 + base libs of the Flutter Linux bundle. (Confirm/expand
# via `ldd` of the bundle in CI — plan premise.)
dependencies:
  - libgtk-3-0
  - libblkid1
  - liblzma5
  # Plan 46 — A/V preview via media_kit (libmpv). On Linux we use the system
  # libmpv (on macOS/Windows it is bundled by media_kit_libs_video).
  - libmpv2
generic_name: Outpost-Pi Cockpit
categories:
  - Development
  - IDE
keywords:
  - pi
  - outpost-pi
  - agent
  - cockpit
startup_notify: true
startup_wm_class: work.jacobmoura.cockpit
icon: linux/runner/resources/app_icon_512.png
metainfo: linux/work.jacobmoura.cockpit.metainfo.xml

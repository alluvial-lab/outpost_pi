# Cockpit DMG — installer window layout (app icon + /Applications shortcut).
# Fastforge uses `appdmg` (npm i -g appdmg) to generate it.
#
# Signing (Developer ID) and notarization do NOT happen here — they are separate
# steps in the runbook (packaging/README.md), applied to the .app before the
# DMG and to the .dmg after. In the manual flow, the DMG is mounted via hdiutil.
title: Outpost-Pi Cockpit
icon: ../../Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png
icon-size: 120
window:
  size:
    width: 540
    height: 380
contents:
  - x: 150
    y: 200
    type: file
    path: Cockpit.app
  - x: 390
    y: 200
    type: link
    path: /Applications

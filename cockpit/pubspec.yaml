name: cockpit
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.4.0+11

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # UI migration: shadcn design system (components, overlays, theme). Replaces
  # Material as the UI layer at the root (`ShadcnApp.router`). Pinned exact —
  # pre-1.0 package (API churns). Note: `ShadcnApp` already injects
  # `DefaultMaterialLocalizations` (en-US) by default, so third-party widgets
  # that embed Material (xterm, media_kit_video, gpt_markdown) work without
  # `flutter_localizations`; and `shadcn_flutter.dart` already re-exports
  # `Icons`, so we keep the Material Icons with no extra import.
  shadcn_flutter: 0.0.52

  # DI + routing + page-scoped state in one package: each feature is a module
  # (`createModule`) that declares its routes + binds. Replaces provider +
  # auto_injector + go_router (removed). See `lib/app/` and CLAUDE.md.
  flutter_modular: ^7.1.0

  # Plan 37 — folder selection (NSOpenPanel on macOS) to open a project.
  file_picker: ^8.1.2

  # Wave 2 — local persistence of projects (saved folder = project).
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Visual identity — Space Mono for display, body, labels, and code; served
  # at runtime and cached by google_fonts.
  google_fonts: ^6.2.1

  # Wave 2 — renders the agent response Markdown (GFM + code).
  gpt_markdown: ^1.1.7

  # Wave 2 — native OS notifications (an agent finished a turn).
  flutter_local_notifications: ^18.0.1

  # Wave 2 — hides the native window bar (we have a custom one) and allows
  # drag/min/max via our bar. macOS/Windows/Linux.
  window_manager: ^0.4.3

  # Wave 2 — terminal tab: emulator + widget (xterm) + native PTY
  # (kyroon_pty: PTY in native code — forkpty on macOS/Linux, ConPTY on
  # Windows 10 1809+; more stable and maintained than the old flutter_pty).
  xterm: ^4.0.0
  kyroon_pty: ^1.0.4

  # Wave 2 — file viewer: renders SVG in the pane (PNG/JPEG via Image.file).
  flutter_svg: ^2.0.10

  # Plan 46 — audio and video preview in the viewer (libmpv via media_kit): a
  # single engine covers A/V, with hardware acceleration, cross-platform.
  # `media_kit_libs_video` bundles libmpv on macOS/Windows; on Linux we use the
  # system one (see linux/packaging/*). NOTE: register in plan 46.
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # Wave 2 — syntax highlighting in the text viewer. Dart port of highlight.js;
  # the default import registers all 189 languages + aliases. We convert the
  # node tree to a TextSpan and paint it with the theme's `SyntaxColors` palette.
  # NOTE: register this dep in plan 37 (orchestrator responsibility).
  highlight: ^0.7.0

  # Wave 2 — paste image/files from the clipboard (Cmd/Ctrl+V) into the composer.
  # Flutter's `Clipboard` only reads text; pasteboard reads image (bytes) and paths.
  # NOTE: register this dep in plan 37 (orchestrator responsibility).
  pasteboard: ^0.4.0

  # Wave 2 — drag files from the OS (Finder/Explorer/etc.) into the input.
  # Flutter's internal drag-drop does not catch native drops; desktop_drop
  # covers macOS/Linux/Windows. NOTE: register this dep in plan 37.
  desktop_drop: ^0.5.0

  # Wave 2 — sticky header per turn in the chat: the user's question stays
  # pinned at the top while the response scrolls. NOTE: register in plan 37.
  flutter_sticky_header: ^0.8.0

  # Connectivity (Slice 3 — pairing) — renders the `outpost-pi` pairing URI as
  # a QR Code in the dialog. NOTE: register this dep in plan 37.
  qr_flutter: ^4.1.0

  # Windows-only — named pipe client (Win32 FFI) to talk to the supervisor,
  # which on Windows listens on `\\.\pipe\…` instead of a UDS. See
  # lib/data/daemon/win_named_pipe.dart.
  ffi: ^2.1.0
  win32: ^5.5.0

  # In-app update notice (plan 43, step 7): current app version
  # (package_info_plus) + open the artifact URL in the browser (url_launcher).
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

  # Plan 47 — native self-update: Sparkle (macOS) + WinSparkle (Windows) via the
  # federated auto_updater plugin. On Linux it is a no-op (NoopSelfUpdater) and
  # the manual notify+download path (UpdateChecker/UpdateCard) takes over. macOS
  # bundles the Sparkle.framework via CocoaPods; Windows vendors WinSparkle.dll.
  auto_updater: ^1.0.0

dependency_overrides:
  # Fork of xterm with procedural rendering of Block Elements (U+2580–259F) and
  # Box Drawing (U+2500–257F): xterm 4.0 paints these glyphs with the font (at
  # natural size, not stretched to the cell), leaving gaps between cells —
  # half-blocks of pixel art (the Claude mascot) come out striped and TUI
  # borders don't connect. The fork draws the blocks/borders procedurally,
  # filling the exact cell, like native terminals. PR to upstream
  # (TerminalStudio/xterm.dart) pending; revert to pub.dev when merged.
  xterm:
    git:
      url: https://github.com/jacobaraujo7/xterm.dart
      ref: feat/builtin-block-glyphs
  gpt_markdown:
    git:
      url: https://github.com/jacobaraujo7/gpt_markdown
      ref: v1.2.2
  # Fork with the UB fix in build_working_directory (kyroon_pty_win.c), which
  # broke PTY spawning on Windows ARM. PR open to upstream
  # (cesarmod2017/kyroon_pty); revert to pub.dev when they publish >= 1.0.5.
  kyroon_pty:
    git:
      url: https://github.com/jacobaraujo7/kyroon_pty
      ref: v1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # File/folder icons by extension (material-icon-theme, MIT). The
  # file->icon map is generated in lib/ui/core/file_icons/file_icon_map.g.dart.
  assets:
    - assets/file_icons/
    - assets/branding/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

# Windows installer (Inno Setup) for the Cockpit. NOT buildable on this Mac —
# generated in the `windows` CI job (windows-latest + Inno Setup). No signing at
# this stage (SmartScreen warning documented on the site).
app_id: dev.kevoun.outpostpi.cockpit
display_name: Outpost-Pi Cockpit
publisher_name: Kevoun
publisher_url: https://kevoun.com
# The Windows runner binary is `cockpit.exe` (BINARY_NAME=cockpit).
executable_name: cockpit.exe
# Installs per-user (no admin required) in %LOCALAPPDATA%\Programs.
install_dir_name: "{userpf}\\Outpost-Pi Cockpit"
privileges_required: lowest
create_desktop_icon: true
setup_icon_file: windows/runner/resources/app_icon.ico
locales:
  - en

services:
  rp-s3:
    build: .
    image: outpost-pi-rp-s3:latest
    container_name: rp-s3
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Future self-hosted distribution data. Defaults are relative to this file;
      # override them with absolute paths when using another local data root.
      - "${RP_S3_COCKPIT_DATA_DIR:-./data/cockpit}:/data/cockpit:ro"
      # Manifest for the mobile app (Android APK).
      - "${RP_S3_APP_DATA_DIR:-./data/app}:/data/app:ro"

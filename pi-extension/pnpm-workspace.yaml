allowBuilds:
  '@google/genai': true
  esbuild: true
  keytar: true
  koffi: true
  protobufjs: true

# Keep transitive packages above known vulnerable ranges until upstreams
# release dependency updates that naturally resolve these versions.
overrides:
  brace-expansion@5: 5.0.8
  esbuild: ^0.28.1
  fast-uri: 3.1.4
  hono: ^4.12.25
  postcss: 8.5.18
  protobufjs: ^7.6.3
  vite: ^8.0.16
  ws: ^8.21.0

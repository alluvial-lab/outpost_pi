# Heap caps tuned for a 12-15GB VM. Was -Xmx3G which OOM-killed the box on 2026-07-20.
# Gradle daemon JVM
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Limit parallel workers so we don't fan out into many JVMs at once
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin daemon JVM (separate process — stacks on top of Gradle daemon)
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m

# Heap caps tuned for a 12-15GB VM. Was -Xmx3G which OOM-killed the box on 2026-07-20.
# Gradle daemon JVM
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Limit parallel workers so we don't fan out into many JVMs at once
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Built-in Kotlin is enabled explicitly so Flutter's compatibility migrator does
# not restore the legacy KGP opt-out. Flutter 3.47's Gradle plugin still requires
# AGP's legacy DSL implementation; remove that separate opt-out once supported.
android.builtInKotlin=true
android.newDsl=false
# Kotlin daemon JVM (separate process — stacks on top of Gradle daemon)
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
